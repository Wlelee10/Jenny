# Supabase 무료 프로젝트는 일주일 동안 접속이 없으면 일시정지됨
# → 3일마다 휴먼 갤러리 목록을 한 번 읽어서 깨어 있게 함
# (주소와 공개용 anon 키는 사이트의 config.js에서 그대로 읽음 — 비밀 키는 쓰지 않음)
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # 3일마다 03:17 UTC
  workflow_dispatch:          # Actions 탭에서 직접 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the gallery once
        run: |
          CONFIG="BuildYourOwnGarden/config.js"
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' "$CONFIG" | head -1)
          KEY=$(grep -oE 'key: "[^"]+"' "$CONFIG" | head -1 | sed -E 's/key: "(.*)"/\1/')
          curl -fsS --retry 3 --retry-delay 10 \
            "$URL/rest/v1/gardens?select=id&limit=1" \
            -H "apikey: $KEY" \
            -o /dev/null -w "Supabase answered: HTTP %{http_code}\n"
